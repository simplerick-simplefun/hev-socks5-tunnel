name: "Build"

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Prepare
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip android-ndk-r27d-linux.zip
          ln -sf . jni
      - name: Build android-so
        if: github.event_name != 'release'
        run: |
          ./android-ndk-r27d/ndk-build clean
          ./android-ndk-r27d/ndk-build APP_MODULES=hev-socks5-tunnel -j$(nproc)
      - name: Build android-bin
        run: |
          ./android-ndk-r27d/ndk-build clean
          ./android-ndk-r27d/ndk-build APP_MODULES=hev-socks5-tunnel-bin -j$(nproc)
          cp libs/armeabi-v7a/hev-socks5-tunnel-bin hev-socks5-tunnel-android-armeabi-v7a
          cp libs/arm64-v8a/hev-socks5-tunnel-bin hev-socks5-tunnel-android-arm64-v8a
          cp libs/x86/hev-socks5-tunnel-bin hev-socks5-tunnel-android-x86
          cp libs/x86_64/hev-socks5-tunnel-bin hev-socks5-tunnel-android-x86_64
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: hev-socks5-tunnel-android
          path: |
            hev-socks5-tunnel-android-armeabi-v7a
            hev-socks5-tunnel-android-arm64-v8a
            hev-socks5-tunnel-android-x86
            hev-socks5-tunnel-android-x86_64
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - android
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: "hev-*"
          merge-multiple: true
      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in release/hev-*; do
            gh release upload ${{ github.event.release.tag_name }} $i
          done
